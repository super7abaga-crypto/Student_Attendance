name: Backend tests

on:
  push:
    branches: [main, feat/engineer-b-attendance]
  pull_request:
    branches: [main]

jobs:
  static-analysis:
    # Guards against the defect class that shipped a 500 in the roster export:
    # a model referenced without being imported. The settings modules are
    # excluded because they legitimately re-export `from .base import *`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pyflakes
      - name: Undefined names and unused imports
        run: python -m pyflakes apps manage.py
      - name: Byte-compile every module
        run: python -m compileall -q apps config manage.py

  sqlite-tests:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Refuse a model change without a migration
        run: python manage.py makemigrations --check --dry-run
      - name: Student portal copy matches Partner A's recorded source
        run: python tools/sync_student_portal.py --check
      - name: pytest suite on SQLite
        run: python -m pytest -q

  settings-guard:
    # Production settings must refuse placeholder secrets and non-PostgreSQL
    # databases, and must pass Django's deployment checks with real-shaped
    # configuration. This closes the check --deploy gap recorded in QA_EVIDENCE.
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgresql://user:pass@db.example.com:5432/attendance
      DB_SSLMODE: require
      REDIS_URL: redis://redis.example.com:6379/0
      CELERY_BROKER_URL: redis://redis.example.com:6379/0
      DJANGO_ALLOWED_HOSTS: attendance.example.com
      CSRF_TRUSTED_ORIGINS: https://attendance.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Deployment checks with generated secrets
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(60))')" \
          ATTENDANCE_SECRET="$(python -c 'import secrets;print(secrets.token_urlsafe(60))')" \
          python manage.py check --deploy
      - name: Placeholder secrets must be refused
        run: |
          if DJANGO_SECRET_KEY=change-me ATTENDANCE_SECRET=change-me python manage.py check; then
            echo "::error::production settings accepted a placeholder secret"
            exit 1
          fi

  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance_user
          POSTGRES_PASSWORD: attendance_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U attendance_user -d attendance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://attendance_user:attendance_password@127.0.0.1:5432/attendance_test
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test apps.core.tests --verbosity 1

name: Backend tests

on:
  push:
    branches: [main, feat/engineer-b-attendance]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: attendance_test
          POSTGRES_USER: attendance_user
          POSTGRES_PASSWORD: attendance_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U attendance_user -d attendance_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://attendance_user:attendance_password@127.0.0.1:5432/attendance_test
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-secret
      CELERY_TASK_ALWAYS_EAGER: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test apps.core.tests --verbosity 1

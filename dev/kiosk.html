<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn2Earn · dev kiosk (live test QR)</title>
<style>
  :root{--navy:#101b35}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#1c2b4d,#0b1424 60%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
  .card{width:min(520px,100%);background:#0f1a30;border:1px solid #26365a;border-radius:18px;padding:26px;text-align:center;box-shadow:0 30px 80px #0006}
  .tag{font-size:10px;letter-spacing:2px;color:#8fa0c0;font-weight:800}
  h1{font-size:20px;margin:8px 0 2px}
  .sub{color:#9fb0cf;font-size:12px;margin:0 0 18px}
  .qr{background:#fff;border-radius:14px;padding:16px;display:inline-block;line-height:0;min-width:292px;min-height:292px}
  .qr canvas,.qr img{width:260px;height:260px;image-rendering:pixelated}
  .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:11px;color:#9fb0cf}
  .meta span{background:#16243d;border:1px solid #27395c;border-radius:20px;padding:6px 12px}
  .meta b{color:#fff;font-weight:700}
  code{display:block;margin-top:16px;font-size:10px;color:#7d8dab;word-break:break-all;background:#0b1526;border:1px solid #1d2c48;border-radius:8px;padding:10px;text-align:left;user-select:all}
  .foot{margin-top:16px;font-size:10.5px;color:#6f7f9d;line-height:1.6}
  .error{margin-top:14px;color:#ff9d9d;font-size:12px;min-height:16px}
</style>
<script src="../vendor/qrcode.min.js"></script>
</head>
<body>
  <div class="card">
    <div class="tag">LEARN 2EARN · DEV ONLY · TEST KIOSK</div>
    <h1 id="sessionName">Loading…</h1>
    <p class="sub">Point the student portal's camera at this code</p>

    <div class="qr"><div id="qr"></div></div>
    <p class="error" id="error"></p>

    <div class="meta">
      <span>Server time (WAT) <b id="serverTime">—</b></span>
      <span>Cutoff <b id="cutoff">—</b></span>
      <span>New code in <b id="countdown">—</b>s</span>
    </div>
    <div class="meta"><span>Campus <b id="campus">—</b></span></div>

    <code id="payload"></code>
    <p class="foot">
      Codes are issued by the local mock in <code>server.py</code> and expire after 30 seconds.
      This page is not part of the student portal and must never be deployed.
    </p>
  </div>

<script>
  const REFRESH_MS = 30000;
  const el = (id) => document.getElementById(id);
  let countdownTimer = null;
  let secondsLeft = 0;
  let lastPayload = "";

  function drawQr(text) {
    const box = el("qr");
    box.innerHTML = "";
    if (!window.QRCode) {
      el("error").textContent = "QR library did not load. Copy the payload below instead.";
      return false;
    }
    new window.QRCode(box, {
      text,
      width: 260,
      height: 260,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: window.QRCode.CorrectLevel.M,
    });
    return true;
  }

  async function refresh() {
    try {
      const response = await fetch("/api/v1/dev/qr", { cache: "no-store" });
      const contentType = response.headers.get("content-type") || "";
      // This page talks to the LOCAL MOCK (server.py) only. Engineer B's Django serves
      // real codes from the mentor portal at / and has no /api/v1/dev/qr route, so a
      // JSON-less or missing answer means we are pointed at the wrong server.
      if (!contentType.includes("application/json")) {
        throw new Error(
          "No dev QR endpoint on this server. This page only works with the local mock "
          + "(python3 server.py). Against Django, use the mentor kiosk at /."
        );
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Could not issue a QR code");

      // Field names come straight from issue_qr() in server.py.
      el("sessionName").textContent = data.session_name;
      el("serverTime").textContent = `${data.server_time_wat} WAT`;
      el("cutoff").textContent = `${data.cutoff_wat} WAT`;
      el("campus").textContent = data.campus || "—";
      el("payload").textContent = data.payload;
      el("error").textContent = "";

      if (data.payload !== lastPayload) {
        lastPayload = data.payload;
        drawQr(data.payload);
      }

      const nowSeconds = Math.floor(Date.now() / 1000);
      secondsLeft = Math.max(0, Number(data.expires_at || 0) - nowSeconds);
      el("countdown").textContent = secondsLeft;
    } catch (error) {
      el("error").textContent = error.message;
      el("countdown").textContent = "—";
      el("sessionName").textContent = "Kiosk unavailable";
      el("payload").textContent = "—";
      const frame = el("qr");
      if (frame) frame.innerHTML = "";
      lastPayload = "";
    }
  }

  function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      secondsLeft = Math.max(0, secondsLeft - 1);
      el("countdown").textContent = secondsLeft;
      if (secondsLeft === 0) refresh();
    }, 1000);
  }

  refresh();
  startCountdown();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
